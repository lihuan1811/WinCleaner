name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-python-qt:
    name: Build Python Qt executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Build executable
        run: python build_exe.py

      - name: Package executable
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "dist/C盘清理精灵.exe" -Destination "CDriveCleanerSpirit.exe" -Force
          Compress-Archive -Path "dist/C盘清理精灵.exe" -DestinationPath "CDriveCleanerSpirit.zip" -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CDriveCleanerSpirit
          path: |
            CDriveCleanerSpirit.exe
            CDriveCleanerSpirit.zip
          if-no-files-found: error

  release:
    name: Publish release downloads
    needs:
      - build-python-qt
    runs-on: windows-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        shell: pwsh
        run: Get-ChildItem release-assets -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$($env:GITHUB_RUN_NUMBER)"
          gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY 2>$null
          gh release create $tag `
            "release-assets/CDriveCleanerSpirit/CDriveCleanerSpirit.exe" `
            "release-assets/CDriveCleanerSpirit/CDriveCleanerSpirit.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "C盘清理精灵 build $($env:GITHUB_RUN_NUMBER)" `
            --notes "Python Qt EXE build. Run C盘清理精灵.exe to scan C drive cleanup paths." `
            --latest
