name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build-python:
    name: Build Python executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: python build_exe.py

      - name: Package Python executable
        shell: pwsh
        run: |
          Copy-Item "dist/C盘清理工具.exe" "dist/WinCleaner-Python.exe" -Force
          Compress-Archive -Path "dist/WinCleaner-Python.exe" -DestinationPath "WinCleaner-Python.zip" -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinCleaner-Python
          path: |
            dist/WinCleaner-Python.exe
            WinCleaner-Python.zip
          if-no-files-found: error

  build-flutter:
    name: Build Flutter Windows UI
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test

      - name: Build Flutter Windows release
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Package Flutter Windows app
        working-directory: flutter_app
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$releaseDir/wincleaner_desktop.exe")) {
            throw "Flutter release executable was not found."
          }
          Copy-Item "$releaseDir/wincleaner_desktop.exe" "$releaseDir/WinCleaner.exe" -Force
          $readme = @(
            "WinCleaner Flutter Windows",
            "",
            "1. Extract this zip completely.",
            "2. Run WinCleaner.exe or Start-WinCleaner.bat.",
            "3. Keep the data folder and DLL files beside the exe."
          )
          Set-Content -Path "$releaseDir/README.txt" -Value $readme -Encoding UTF8
          $launcher = @(
            "@echo off",
            "cd /d ""%~dp0""",
            "start """" ""WinCleaner.exe"""
          )
          Set-Content -Path "$releaseDir/Start-WinCleaner.bat" -Value $launcher -Encoding ASCII
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "../WinCleaner-Flutter-Windows.zip" -Force

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Flutter Windows self-extracting launcher
        shell: pwsh
        run: |
          $installerDir = "installer"
          New-Item -ItemType Directory -Force $installerDir | Out-Null
          Copy-Item "WinCleaner-Flutter-Windows.zip" "$installerDir/payload.zip" -Force

          Set-Content -Path "$installerDir/WinCleanerSetup.csproj" -Encoding UTF8 -Value @(
            '<Project Sdk="Microsoft.NET.Sdk">'
            '  <PropertyGroup>'
            '    <OutputType>WinExe</OutputType>'
            '    <TargetFramework>net8.0-windows</TargetFramework>'
            '    <RuntimeIdentifier>win-x64</RuntimeIdentifier>'
            '    <SelfContained>true</SelfContained>'
            '    <PublishSingleFile>true</PublishSingleFile>'
            '    <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>'
            '    <AssemblyName>WinCleaner-Setup</AssemblyName>'
            '  </PropertyGroup>'
            '  <ItemGroup>'
            '    <EmbeddedResource Include="payload.zip" LogicalName="payload.zip" />'
            '  </ItemGroup>'
            '</Project>'
          )

          Set-Content -Path "$installerDir/Program.cs" -Encoding UTF8 -Value @(
            'using System;'
            'using System.Diagnostics;'
            'using System.IO;'
            'using System.IO.Compression;'
            'using System.Reflection;'
            ''
            'var baseDir = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "WinCleaner");'
            'var appDir = Path.Combine(baseDir, "app");'
            'var zipPath = Path.Combine(baseDir, "WinCleaner-Flutter-Windows.zip");'
            'Directory.CreateDirectory(baseDir);'
            ''
            'using (var stream = Assembly.GetExecutingAssembly().GetManifestResourceStream("payload.zip") ?? throw new InvalidOperationException("payload.zip missing"))'
            'using (var file = File.Create(zipPath))'
            '{'
            '    stream.CopyTo(file);'
            '}'
            ''
            'if (Directory.Exists(appDir))'
            '{'
            '    Directory.Delete(appDir, true);'
            '}'
            ''
            'Directory.CreateDirectory(appDir);'
            'ZipFile.ExtractToDirectory(zipPath, appDir, true);'
            ''
            'var exePath = Path.Combine(appDir, "WinCleaner.exe");'
            'if (!File.Exists(exePath))'
            '{'
            '    exePath = Path.Combine(appDir, "wincleaner_desktop.exe");'
            '}'
            ''
            'if (!File.Exists(exePath))'
            '{'
            '    throw new FileNotFoundException("WinCleaner executable was not found after extraction.", exePath);'
            '}'
            ''
            'Process.Start(new ProcessStartInfo(exePath) { WorkingDirectory = appDir, UseShellExecute = true });'
          )

          dotnet publish "$installerDir/WinCleanerSetup.csproj" -c Release -o "$installerDir/out"
          Copy-Item "$installerDir/out/WinCleaner-Setup.exe" "WinCleaner-Setup.exe" -Force

      - name: Upload Flutter Windows app
        uses: actions/upload-artifact@v4
        with:
          name: WinCleaner-Flutter-Windows
          path: |
            WinCleaner-Setup.exe
            WinCleaner-Flutter-Windows.zip
          if-no-files-found: error

  release:
    name: Publish release downloads
    needs:
      - build-python
      - build-flutter
    runs-on: windows-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$($env:GITHUB_RUN_NUMBER)"
          gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY 2>$null
          gh release create $tag `
            "release-assets/WinCleaner-Flutter-Windows/WinCleaner-Setup.exe" `
            "release-assets/WinCleaner-Flutter-Windows/WinCleaner-Flutter-Windows.zip" `
            "release-assets/WinCleaner-Python/WinCleaner-Python.exe" `
            "release-assets/WinCleaner-Python/WinCleaner-Python.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "WinCleaner build $($env:GITHUB_RUN_NUMBER)" `
            --notes "Download WinCleaner-Setup.exe first. It contains the complete Flutter Windows app and launches WinCleaner after extracting it. The portable zip is only for manual extraction." `
            --latest