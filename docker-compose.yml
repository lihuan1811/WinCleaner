services:
  postgres:
    image: postgres:16-alpine
    container_name: wincleaner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wincleaner
      POSTGRES_USER: wincleaner
      POSTGRES_PASSWORD: wincleaner
    ports:
      - "5432:5432"
    volumes:
      - wincleaner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wincleaner -d wincleaner"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  wincleaner_pg_data:
